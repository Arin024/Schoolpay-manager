    <script>
      // Suppress and handle benign Vite dev server HMR WebSocket close warnings in cloud iframe environments
      (function () {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function (url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')));
            if (isViteHmr) {
              const target = new EventTarget();
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.readyState = 1;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url);
              target.send = function () {};
              target.close = function () {
                target.readyState = 3;
                target.dispatchEvent(new Event('close'));
              };
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function (e) {
          const reasonStr = String(e?.reason?.message || e?.reason || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('error', function (e) {
          const msgStr = String(e?.message || e?.error?.message || '');
          if (msgStr.includes('WebSocket') || msgStr.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        const _origConsoleError = console.error;
        console.error = function (...args) {
          if (args.some(a => typeof a === 'string' && (a.includes('WebSocket') || a.includes('[vite]')))) {
            return;
          }
          _origConsoleError.apply(console, args);
        };
      })();
    </script>

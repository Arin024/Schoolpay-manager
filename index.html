    <title>School Pay Manager - Simple School Payments. Smarter School Management.</title>
    <script>
      // Suppress benign Vite dev server HMR WebSocket close warning in cloud iframe environments
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (args.some(a => typeof a === 'string' && (a.includes('WebSocket') || a.includes('[vite]')))) {
          return;
        }
        _origConsoleError.apply(console, args);
      };
    </script>
    <meta name="description" content="Commercial multi-tenant SaaS platform for Nigerian schools. Simple school payments. Smarter school management." />

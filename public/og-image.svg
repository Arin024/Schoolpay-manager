
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Pill -->
  <rect x="80" y="80" width="340" height="42" rx="21" fill="#047857" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="106" cy="101" r="5" fill="#10B981"/>
  <text x="122" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34D399" letter-spacing="1.5">MULTI-TENANT SAAS PLATFORM</text>

  <!-- Brand Logo Badge -->
  <g transform="translate(80, 150)" filter="url(#shadow)">
    <rect width="90" height="90" rx="24" fill="url(#brand)" stroke="#34D399" stroke-width="2"/>
    <text x="45" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">₦</text>
  </g>

  <!-- Main Title -->
  <text x="195" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">School Pay Manager</text>

  <!-- Subheadline -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#10B981">Simple school payments. Smarter school management.</text>

  <!-- Value Description -->
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Dedicated commercial multi-tenant operating system for Nigerian nursery, primary,
  </text>
  <text x="80" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    secondary colleges, and comprehensive K-12 academies with zero-trust isolation.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">✓ Automated Invoicing</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="355" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">✓ Verifiable Receipts</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="240" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">✓ Bank &amp; Online Pay</text>

    <!-- Pill 4 -->
    <rect x="750" y="0" width="220" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="860" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">✓ Strict Data Isolation</text>
  </g>


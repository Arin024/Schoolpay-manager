  <line x1="80" y1="560" x2="1120" y2="560" stroke="#334155" stroke-width="1"/>
  <text x="80" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748B">schoolpay.ng • Official Support: SchoolPay28@gmail.com • WhatsApp: 08160754659</text>
  <text x="1120" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="end">30-Day Free Trial</text>

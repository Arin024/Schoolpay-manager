name = "school-pay-manager"
main = "cloudflare/worker.ts"
compatibility_date = "2024-10-01"

# Automatically serve the React PWA frontend from dist/
[assets]
directory = "dist"

# Environment variables (Non-sensitive)
[vars]
ENVIRONMENT = "production"
TOKEN_EXPIRY_DAYS = "7"

# Cloudflare D1 Database binding
# NOTE: Once you run 'wrangler d1 create schoolpay-db' in Termux or Cloudflare Dashboard,
# uncomment the lines below and insert your real database_id:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "schoolpay-db"
# database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"

# Note: Secret variables like JWT_SECRET should be set using:
# wrangler secret put JWT_SECRET (or in Cloudflare Dashboard -> Settings -> Variables)

